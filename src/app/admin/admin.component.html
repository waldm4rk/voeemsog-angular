<div class="wrapper" *ngIf="isAuthorized">
    <div class="input">
        <form action="" (ngSubmit)="formatText()">
            <div class="meta">
                <input [(ngModel)]="room.code" type="text" name="code" placeholder="Айди">
                <input [(ngModel)]="roomTranslation.name" type="text" name="name" placeholder="Название">
                <input [(ngModel)]="room.dangerType" type="text" name="dangerType" placeholder="Опасность (число)">
                <input [(ngModel)]="room.size" type="text" name="size" placeholder="Размер (2x2)">
                <input [(ngModel)]="room.color" type="text" name="color" placeholder="Цвет (на английском)">
                <input [(ngModel)]="room.lightLevel" type="text" name="lightLevel" placeholder="Свет (число)">
            </div>
            <textarea name="text" id="descr" [(ngModel)]="roomTranslation.description" rows="40" placeholder="Текст" cols="100" id=""></textarea>
            <select [(ngModel)]="roomTranslation.lang"  name="lang" id="lang">
                <option *ngIf="roomTranslation.lang == 'en_US'" selected="selected" value="en_US">en_US</option>
                <option *ngIf="roomTranslation.lang == 'en_US'" value="ru_RU">ru_RU</option>
                <option *ngIf="roomTranslation.lang == 'ru_RU'" selected="selected" value="ru_RU">ru_RU</option>
                <option *ngIf="roomTranslation.lang == 'ru_RU'" value="en_US">en_US</option>

                <option *ngIf="roomTranslation.lang != 'ru_RU' && roomTranslation.lang != 'en_US'" value="en_US">en_US</option>
                <option *ngIf="roomTranslation.lang != 'ru_RU' && roomTranslation.lang != 'en_US'" value="ru_RU">ru_RU</option>
            </select>
            <button type="submit">Проверить</button>
        </form>
    </div>
    <div class="page">
        <div class="title">
            <div class="seal"><img src="assets/room/sit seal.png" alt=""></div>
            <div class="info">
                <div class="id">{{room.code}}</div>
                <div class="name">{{roomTranslation.name}}</div>
            </div>
        </div>
        <div class="content" *ngIf="paragraphs.length">
            <div class="containerWrap" *ngFor="let paragraph of paragraphs">
                <div class="container" *ngIf="paragraph.reverse == false">
                    <div class="images" *ngIf="paragraph.images == true && paragraph.params.at(0) != 'INFO'">
                        <img 
                            [src]="paragraph.params.at(0)"
                            [style.max-width]="paragraph.params.at(1)"
                            [style.aspect-ratio]="paragraph.params.at(2)"
                        >
                    </div>
                    <div class="images" *ngIf="paragraph.images == true && paragraph.params.at(0) == 'INFO'">
                        <div class="infoContainer"><img src='https://ik.imagekit.io/voeemsog/{{roomTranslation.lang}}/danger-{{room.dangerType}}.jpg'>
                        <img src="https://ik.imagekit.io/voeemsog/{{roomTranslation.lang}}/light-{{room.lightLevel}}.jpg">
                        <img src="https://ik.imagekit.io/voeemsog/{{roomTranslation.lang}}/floor-1.jpg"></div>
                    </div>
                    <div class="text" *ngIf="paragraph.text != ''" [innerHTML]="paragraph.text">
                        
                    </div>
                </div>
                <div class="container reverse" *ngIf="paragraph.reverse == true">
                    <div class="images" *ngIf="paragraph.images == true && paragraph.params.at(0) != 'INFO'">
                        <img 
                            [src]="paragraph.params.at(0)"
                            [style.max-width]="paragraph.params.at(1)"
                            [style.aspect-ratio]="paragraph.params.at(2)"
                        >
                    </div>
                    <div class="images" *ngIf="paragraph.images == true && paragraph.params.at(0) == 'INFO'">
                        <div class="infoContainer"><img src='https://ik.imagekit.io/voeemsog/{{roomTranslation.lang}}/danger-{{room.dangerType}}.jpg'>
                        <img src="https://ik.imagekit.io/voeemsog/{{roomTranslation.lang}}/light-{{room.lightLevel}}.jpg">
                        <img src="https://ik.imagekit.io/voeemsog/{{roomTranslation.lang}}/floor-1.jpg"></div>
                    </div>
                    <div class="text" [innerHTML]="paragraph.text">
                        
                    </div>
                </div>
            </div>
            <!-- <div class="container reverse">
                <div class="images">
                    <img src="assets/room/danger.svg">
                    <img src="assets/room/light.svg">
                    <img src="assets/room/floor.svg">
                </div>
                <span class="text">
                    {{ 
                        sliceStringBySentences(data.at(0)?.description, 10, 0)
                         }}.
                </span>
            </div>
            <div class="container">
                <div class="images">
                    <img class="big" src="assets/room/shape.svg">
                </div>
                <span class="text">
                </span>
            </div> -->
        </div>
    </div>
    
    <button style="padding: 10px;" (click)="submitRoom()">Опубликовать Комнату!</button>
    <button style="padding: 10px;" (click)="submitTranslation()">Опубликовать Перевод!</button>
    <a href="#" (click)="logout()">Выйти</a>
</div>
