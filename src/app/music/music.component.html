<div class="wrapper">
    <div class="overlay"></div>
    <div class="title">
    <h1>{{'HEADER.ARCHIVE' | translate}}</h1>
    <h4>{{'MUSIC.MUSIC' | translate}}</h4>
  </div>
  <div class="container">
    <div class="category">
        <div class="category_title">
            <h1>{{'MUSIC.ALBUMS' | translate}}</h1>
            <hr>
        </div>
        <div class="category_content">
            <div class="album" (click)="redirectTo(album.id)" *ngFor="let album of this.albums">
              <img [src]="'/music/' + album.coverLink" alt="album">
            </div>
        </div>
    </div>
  </div>
</div>
