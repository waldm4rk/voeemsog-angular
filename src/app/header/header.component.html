<header class="mainHeader" [style.top]="headerTop">
  <div class="navCont" [ngClass]="{'open': isBurgerOpen}">
    <nav>
      <ul>
        <li class="burger" (click)="toggleBurger()">
          <img src="assets/burger.svg" alt="">
        </li>
        <li class="desktop-link"><a routerLink="/about">{{'HEADER.ABOUT' | translate}}</a></li>
        <li class="desktop-link"><a routerLink="/rooms">{{'HEADER.ROOMS' | translate}}</a></li>
        <li class="logo"><img src="assets/logo.svg" alt="" (click)="home()"></li>
        <li class="desktop-link"><a routerLink="/archive">{{'HEADER.ARCHIVE' | translate}}</a></li>
        <li class="search-text desktop-link" (click)="toggleSearch($event)">{{'HEADER.SEARCH' | translate}}</li>
        <li class="search-text search-icon" (click)="toggleSearch($event)"><img src="assets/search.svg" alt=""></li>
      </ul>
    </nav>

      <div class="mobile-menu" [ngClass]="{'open': isBurgerOpen}" (click)="$event.stopPropagation()">
        <ul>
          <li><a routerLink="rooms" (click)="closeMenu()">{{'HEADER.ROOMS' | translate}}</a></li>
          <li><a routerLink="/" (click)="closeMenu()">{{'HEADER.ARCHIVE' | translate}}</a></li>
          <li><a routerLink="/" (click)="closeMenu()">{{'HEADER.ABOUT' | translate}}</a></li>
        </ul>
      </div>

    <div class="searchBar" [ngClass]="{'visible': isVisibleSearch}">
      <input type="text">
      <img class="icon" src="assets/strelka.svg" alt="">
    </div>
  </div>
</header>

<div class="overlay" [ngClass]="{'visibleI': isVisibleSearch || isBurgerOpen}" (click)="closeAll()"></div>
