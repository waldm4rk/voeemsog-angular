<header class="mainHeader" [style.top]="headerTop">
  <div class="navCont" [ngClass]="{'open': isBurgerOpen}">
    <nav>
      <ul>
        <li class="burger" (click)="toggleBurger()">
          <img src="/header/burger.svg" alt="">
        </li>
        <li class="desktop-link" (click)="redirect('/about')"><a routerLink="/about">{{'HEADER.ABOUT' | translate}}</a></li>
        <li class="desktop-link" (click)="redirect('/rooms')"><a routerLink="/rooms">{{'HEADER.ROOMS' | translate}}</a></li>
        <li class="logo"><img src="/header/logo.svg" alt="" (click)="home()"></li>
        <li class="desktop-link" (click)="redirect('/archive')"><a routerLink="/archive">{{'HEADER.ARCHIVE' | translate}}</a></li>
        <li class="search-text desktop-link" (click)="toggleSearch($event)"><a>{{'HEADER.SEARCH' | translate}}</a></li>
        <li class="search-text search-icon" (click)="toggleSearch($event)"><img src="/header/search.svg" alt=""></li>
      </ul>
    </nav>

      <div class="mobile-menu" [ngClass]="{'open': isBurgerOpen}" (click)="$event.stopPropagation()">
        <ul>
          <li><a routerLink="/rooms" (click)="closeMenu()">{{'HEADER.ROOMS' | translate}}</a></li>
          <li><a routerLink="/archive" (click)="closeMenu()">{{'HEADER.ARCHIVE' | translate}}</a></li>
          <li><a routerLink="/about" (click)="closeMenu()">{{'HEADER.ABOUT' | translate}}</a></li>
          <li style="display:flex; justify-content: space-between;">
            <a (click)="prevLang()"><</a>
            <a id="currentLang">{{ currentLang }}</a>
            <a (click)="nextLang()">></a>
          </li>        
        </ul>
      </div>

    <div class="searchBar" [ngClass]="{'visible': isVisibleSearch}">
      <form (submit)="searchRooms(); $event.preventDefault()">
        <input type="text" maxlength="82" class="globalSearch" autofocus>
        <img class="icon" src="/header/arrow.svg" (click)="searchRooms(); $event.preventDefault()" alt="">
      </form>
    </div>
  </div>
</header>

<div class="overlay" [ngClass]="{'visibleI': isVisibleSearch || isBurgerOpen}" (click)="closeAll()"></div>
