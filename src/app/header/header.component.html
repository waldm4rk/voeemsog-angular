<header class="mainHeader" [style.top]="headerTop">
  <div class="navCont" [ngClass]="{'open': isBurgerOpen}">
    <nav>
      <ul>
        <li class="burger" (click)="toggleBurger()">
          <img src="assets/burger.svg" alt="">
        </li>
        <li><a routerLink="/about">О НАС</a></li>
        <li><a routerLink="/requests">ЗАЯВКИ</a></li>
        <li class="logo"><a routerLink="/"><img src="assets/logo.svg" alt=""></a></li>
        <li><a routerLink="/archive">АРХИВ</a></li>
        <li class="search-text" (click)="toggleSearch($event)">ПОИСК</li>
        <li class="search-text search-icon" (click)="toggleSearch($event)"><img src="assets/search.svg" alt=""></li>
      </ul>
    </nav>

    <div class="searchBar" [ngClass]="{'visible': isVisibleSearch}">
      <input type="text">
      <img class="icon" src="assets/strelka.svg" alt="">
    </div>
  </div>
</header>

<div class="overlay" [ngClass]="{'visibleI': isVisibleSearch}" (click)="isVisibleSearch = false"></div>
