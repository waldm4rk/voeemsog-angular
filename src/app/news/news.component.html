<div class="wrapper">
    <h2 class="title">{{'MAIN.WALL' | translate}}</h2>
    <div class="categories">
        <div class="category" class="{{category}}" (click)="addFilter(category)" *ngFor="let category of categories">
            <div class="checkmark"></div>
            <span class="categoryName">{{category}}</span>
        </div>
    </div>
    <section class="posts" *ngIf="!loading">
        <div class="post #post {{post.tags.join(' ')}} {{post.pinned == true ? 'pinned' : ''}}" *ngFor="let post of filter" >
            <h2 class="postTitle">
                <span>{{post.title}}</span>
                <img *ngIf="post.pinned" src="/news/pin.jpg" alt="">
            </h2> 
            <div class="meta">{{post.postDate}}<br/>{{'NEWS.TAGS' | translate}}: {{post.tags.join(', ')}}<br/><a *ngIf="this.isAuthorized" (click)="deletePost(post.id)">X</a></div>
            <div class="postText" style="white-space: pre-wrap;" [innerHTML]="post.text"></div>
        </div>
    </section>
</div>
