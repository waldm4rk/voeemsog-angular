<div class="wrapper" *ngIf="isAuthorized">
  <div class="categories">
    <div
      class="category"
      class="{{ category }}"
      *ngFor="let category of this.categories"
      (click)="addFilter(category)"
    >
      <div class="checkmark"></div>
      <span class="categoryName">{{ category }}</span>
    </div>
  </div>
  <section class="posts">
    <form (ngSubmit)="publishPost()">
      <div class="post">
        <h2 class="postTitle">
          <input type="text" class="newsTitle" name="title"/><img (click)="togglePin()" src="/news/pin.jpg" alt="" />
        </h2>
        <div class="meta"><br />Теги: {{ this.filterCat.join(", ") }}</div>
        <div class="postText">
          <textarea name="text" class="newsText" style="white-space: pre-wrap"></textarea>
        </div>
      </div>
      <button>Опубликовать!</button>
    </form>
  </section>
</div>
