<section class="main">
    
    <div class="title">
        <h1>{{'HEADER.ARCHIVE' | translate}}</h1>
        <h4>{{'LITERATURE.STORIES' | translate}}</h4>
    </div>

    <div class="storyTitle">
        <h2>{{this.data?.title}}</h2>
        <h5>{{'LITERATURE.ADDED' | translate}} {{this.data?.date}}</h5>
    </div>

    <div class="story">
        <div class="storyTxt">
            <pre>{{this.data?.text}}</pre>
        </div>
    </div>

    <div class="btns" *ngIf="isAuthorized" style='display:flex; justify-content: center; font-size: 30px;'>
        <a (click)="deleteStory()" style="display: block; height: fit-content; cursor: pointer;">🚮</a>
        <a [routerLink]="['/admin/stories']"
   [queryParams]="{
     id: this.data?.id,
     title: this.data?.title,
     text: this.data?.text,
     category: this.data?.category,
     date: this.data?.date,
     readingTime: this.data?.readingTime,
     lang: this.data?.lang
   }" style="display: block; height: fit-content; cursor: pointer;">📝</a>
    </div>

    <div class="bg">
        <div class="cube"></div>
        <div class="cube"></div>
        <div class="cube"></div>
    </div>

</section>
