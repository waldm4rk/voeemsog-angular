<section class="main">
    
    <div class="title">
        <h1>{{'HEADER.ARCHIVE' | translate}}</h1>
        <h4>{{'LITERATURE.STORIES' | translate}}</h4>
    </div>

    <div class="storyTitle">
        <h2>{{this.data?.title}}</h2>
        <h5>{{'LITERATURE.ADDED' | translate}} {{this.data?.date}}</h5>
    </div>

    <div class="story">
        <div class="storyTxt">
            <pre>{{this.data?.text}}</pre>
        </div>
    </div>

    <a
    href="https://www.donationalerts.com/r/voeemsog"
    target="_blank"
    rel="noopener noreferrer"
    class="donate-button"
>
    <svg class="donate-icon" viewBox="36 -12 440 440" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <path d="M256 416c114.9 0 208-93.1 208-208S370.9 0 256 0 48 93.1 48 208s93.1 208 208 208z" fill="none" stroke="#e8eeee" stroke-width="24"></path>
        <path fill="#e8eeee" d="M233.8 97.4V80.6c0-9.2 7.4-16.6 16.6-16.6h11.1c9.2 0 16.6 7.4 16.6 16.6v17c15.5.8 30.5 6.1 43 15.4 5.6 4.1 6.2 12.3 1.2 17.1L306 145.6c-3.8 3.7-9.5 3.8-14 1-5.4-3.4-11.4-5.1-17.8-5.1h-38.9c-9 0-16.3 8.2-16.3 18.3 0 8.2 5 15.5 12.1 17.6l62.3 18.7c25.7 7.7 43.7 32.4 43.7 60.1 0 34-26.4 61.5-59.1 62.4v16.8c0 9.2-7.4 16.6-16.6 16.6h-11.1c-9.2 0-16.6-7.4-16.6-16.6v-17c-15.5-.8-30.5-6.1-43-15.4-5.6-4.1-6.2-12.3-1.2-17.1l16.3-15.5c3.8-3.7 9.5-3.8 14-1 5.4 3.4 11.4 5.1 17.8 5.1h38.9c9 0 16.3-8.2 16.3-18.3 0-8.2-5-15.5-12.1-17.6l-62.3-18.7c-25.7-7.7-43.7-32.4-43.7-60.1.1-34 26.4-61.5 59.1-62.4z"></path>
    </svg>
    {{'STORY.DONATION' | translate}}
</a>


    <div class="btns" *ngIf="isAuthorized" style='display:flex; justify-content: center; font-size: 30px;'>
        <a (click)="deleteStory()" style="display: block; height: fit-content; cursor: pointer;">🚮</a>
        <a [routerLink]="['/admin/stories']"
   [queryParams]="{
     id: this.data?.id,
     title: this.data?.title,
     text: this.data?.text,
     category: this.data?.category,
     date: this.data?.date,
     readingTime: this.data?.readingTime,
     lang: this.data?.lang
   }" style="display: block; height: fit-content; cursor: pointer;">📝</a>
    </div>

    <div class="bg">
        <div class="cube"></div>
        <div class="cube"></div>
        <div class="cube"></div>
    </div>

</section>
