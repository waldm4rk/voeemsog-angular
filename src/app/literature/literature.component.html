<div class="wrapper">
    <div class="title">
        <h1>{{'HEADER.ARCHIVE' | translate}}</h1>
        <h4>{{'MAIN.LITERATURE' | translate}}</h4>
    </div>
    <div class="main">
        <!-- ХОХЛАМ: Продублируй этот див, вручную пропиши данные и тестируй респонсив -->
        <div class="category" *ngFor="let item of this.stories | mapToArray">
            <div class="cat_title">
                <h1>{{item.value[0]?.category?.title}}</h1>
                <hr/>
            </div>
            <div class="cat_content">
                <div class="story" *ngFor="let story of item.value" (click)="redirectToPage(story.id)">
                    <h4>{{story.title}}</h4>
                    <p class="reading_time">Время чтения: <b>{{story.readingTime}} мин.</b></p>
                    <pre class="text">{{story.text.slice(0, 271)}}...</pre>
                </div>
            </div>
        </div>
    </div>
</div>
