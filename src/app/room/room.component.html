<div class="wrapper">
    <div class="page">
        <div class="title">
            <div class="seal"><img src="https://media.voeemsog.com/room/info/seals/{{this.author}}.jpg" alt=""></div>
            <div class="info">
                <div class="id">{{data.at(0)?.code}}</div>
                <div class="name">{{data.at(0)?.name}}</div>
            </div>
        </div>
        <div class="content" *ngIf="paragraphsObject.length">
            <div class="containerWrap" *ngFor="let paragraph of paragraphsObject">
                <div class="container" *ngIf="paragraph.reverse == false">
                    <div class="images" *ngIf="paragraph.images == true && paragraph.params.at(0) != 'INFO'">
                        <img 
                            [src]="paragraph.params.at(0)"
                            [style.max-width]="paragraph.params.at(1)"
                            [style.aspect-ratio]="paragraph.params.at(2)"
                        >
                    </div>
                    <div class="images" *ngIf="paragraph.images == true && paragraph.params.at(0) == 'INFO'">
                        <div class="infoContainer"><img src='https://media.voeemsog.com/room/info/{{this.cookies.returnLang()}}/danger-{{this.data.at(0)?.dangerType}}.jpg'>
                        <img src="https://media.voeemsog.com/room/info/{{this.cookies.returnLang()}}/light-{{this.data.at(0)?.lightLevel}}.jpg">
                        <img src="https://media.voeemsog.com/room/info/{{this.cookies.returnLang()}}/floor-1.jpg"></div>
                    </div>
                    <div class="text" *ngIf="paragraph.text != ''" [innerHTML]="paragraph.text">
                        
                    </div>
                </div>
                <div class="container reverse" *ngIf="paragraph.reverse == true">
                    <div class="images" *ngIf="paragraph.images == true && paragraph.params.at(0) != 'INFO'">
                        <img 
                            [src]="paragraph.params.at(0)"
                            [style.max-width]="paragraph.params.at(1)"
                            [style.aspect-ratio]="paragraph.params.at(2)"
                        >
                    </div>
                    <div class="images" *ngIf="paragraph.images == true && paragraph.params.at(0) == 'INFO'">
                        <div class="infoContainer"><img src='https://media.voeemsog.com/room/info/{{this.cookies.returnLang()}}/danger-{{this.data.at(0)?.dangerType}}.jpg'>
                        <img src="https://media.voeemsog.com/room/info/{{this.cookies.returnLang()}}/light-{{this.data.at(0)?.lightLevel}}.jpg">
                        <img src="https://media.voeemsog.com/room/info/{{this.cookies.returnLang()}}/floor-1.jpg"></div>
                    </div>
                    <div class="text" [innerHTML]="paragraph.text">
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
